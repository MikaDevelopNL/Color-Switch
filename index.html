<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Color Switch</title>
		<link rel="stylesheet" href="style.css"/>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
	</head>
	<body>
		<main class="main">
			<div class="container">
				<h1 class="title">The Color Switch</h1>
				<p class="txt">Choose a color to design the website in that color.</p> 
				<div class="buttons">
					<button class="blue-btn btn">Blue</button>
					<button class="purple-btn btn">Purple</button>
					<button class="green-btn btn">Green</button>
				</div>
				<p class="btn-txt"></p>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
